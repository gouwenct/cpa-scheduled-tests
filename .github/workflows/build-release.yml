name: platform-builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            python_arch: x64
          - runner: macos-15
            goos: darwin
            goarch: arm64
            python_arch: arm64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            python_arch: x64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            python_arch: arm64
          - runner: windows-2022
            goos: windows
            goarch: amd64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Select Windows C compiler
        if: runner.os == 'Windows'
        run: |
          echo '${{ steps.msys2.outputs.msys2-location }}/mingw64/bin' >> "$GITHUB_PATH"
          echo 'CC=gcc' >> "$GITHUB_ENV"
      - name: Test and vet
        run: |
          go test -timeout 120s ./...
          go vet ./...
      - name: Build, load and package
        run: python build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: python build-release.py --checksums
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Publish all platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/checksums.txt
          --verify-tag --title "CPA Scheduled 5H $RELEASE_TAG" --generate-notes
